# RA-016: the suite existed but nothing enforced it, and `npm test` was a dead
# script pointing at a vitest that was never installed. Both fixed here.
name: check

on:
  push:
  pull_request:

# NFV-013: least privilege by default. A workflow that only builds and tests
# has no reason to be able to write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to a SHA: a tag is mutable, and this workflow runs on every push.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773 # v1.2.0

      # Piping `releases/latest` into a shell runs whatever is published at the
      # moment the job starts. Pin the version and check the artifact before it
      # executes (NFV-013).
      - name: Install Compact
        env:
          COMPACT_VERSION: '0.31.1'
        run: |
          set -euo pipefail
          url="https://github.com/midnightntwrk/compact/releases/download/v${COMPACT_VERSION}/compact-installer.sh"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o /tmp/compact-installer.sh
          sha256sum /tmp/compact-installer.sh | tee /tmp/compact-installer.sha256
          if [ -f .github/compact-installer.sha256 ]; then
            sha256sum -c .github/compact-installer.sha256
          else
            echo "::warning::no pinned checksum committed; recording the observed one"
          fi
          sh /tmp/compact-installer.sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm ci --prefix ui --legacy-peer-deps

      - name: Start anvil
        run: anvil --port 8545 --silent &

      # NFV-004: the previous version of this step built its OWN witness object
      # and regexed circuit names out of the harness source, so it passed while
      # `proof:real` could not even construct the contract. It now imports the
      # one bundle the whole repo shares and constructs the real generated
      # contract with it. If a witness is missing, this fails here.
      - name: Real-proof harness constructs the compiled contract
        run: |
          npm run compile
          node --input-type=module -e "
            import * as nf from './contracts/managed/nightfold/contract/index.js';
            import { witnesses, WITNESS_NAMES } from './src/witnesses.mjs';
            const contract = new nf.Contract(witnesses);
            const circuits = Object.keys(contract.impureCircuits);
            console.log('constructed with', WITNESS_NAMES.length, 'witnesses:', WITNESS_NAMES.join(', '));
            console.log('circuits:', circuits.join(', '));
            if (!circuits.includes('openHand')) { console.error('openHand missing'); process.exit(1); }
          "

      - run: npm test
      - run: npm run build --prefix ui
      # NFV-012: this used to end in `|| true`, so no advisory could ever gate
      # the build. solc and viem are build-and-test tools and now live in
      # devDependencies, so the production tree is clean and this can be real.
      - name: Production dependencies have no known advisories
        run: npm audit --omit=dev --audit-level=high
