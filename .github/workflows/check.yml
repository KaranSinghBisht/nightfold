# RA-016: the suite existed but nothing enforced it, and `npm test` was a dead
# script pointing at a vitest that was never installed. Both fixed here.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Compact
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm ci --prefix ui --legacy-peer-deps

      - name: Start anvil
        run: anvil --port 8545 --silent &

      # RA-012: proof:real was calling commitDeal and reading holeCommits long
      # after both were removed, because contracts/managed is gitignored and a
      # stale local build never fails anything. CI compiles fresh and then
      # asserts the harness and the artifact agree on what the contract is.
      - name: Real-proof harness matches the compiled contract
        run: |
          npm run compile
          node --input-type=module -e "
            import * as nf from './contracts/managed/nightfold/contract/index.js';
            import { readFileSync } from 'node:fs';
            const src = readFileSync('src/midnight/realproof.mjs', 'utf8');
            const contract = new nf.Contract({
              seatSecret: () => [], holeCards: () => [], holeSalt: () => [],
              boardSalt: () => [], claimedHand: () => [], handPick: () => [],
            });
            const available = new Set([
              ...Object.keys(contract.impureCircuits),
              ...Object.keys(nf.pureCircuits),
            ]);
            const called = [...src.matchAll(/'([a-zA-Z]+)'\s*,\s*[a-z]+\.ps|pc\.([a-zA-Z]+)\(/g)]
              .flatMap((m) => [m[1], m[2]]).filter(Boolean);
            const missing = [...new Set(called)].filter((n) => !available.has(n));
            if (missing.length) {
              console.error('harness calls circuits the contract does not have:', missing.join(', '));
              process.exit(1);
            }
            console.log('harness and artifact agree —', available.size, 'circuits');
          "

      - run: npm test
      - run: npm run build --prefix ui
      - run: npm audit --omit=dev --audit-level=high || true
